# Manual chapter definitions for books where automatic detection fails
#
# This file provides fallback chapter structures when the multi-strategy auto-detection
# in chapter_detection.py cannot reliably identify chapters.
#
# Format: Book filename (with extension) mapped to list of chapter titles in order
#
# Usage:
# 1. Run stage_1_basic_chunking.py and check validation_report.json
# 2. If a book has missing/wrong chapters, add its correct structure here
# 3. Use exact chapter titles as they appear in the book (case-sensitive)
# 4. Don't include "Chapter X" prefix if the book doesn't use it consistently
# 5. Re-run stage_1 and the manual config will be used

# FX Options and Structured Products
