workerPoolSpecs:
  machineSpec:
    machineType: n1-standard-4
    acceleratorType: NVIDIA_TESLA_T4
    acceleratorCount: 1
  replicaCount: 1
  containerSpec:
    imageUri: europe-west2-docker.pkg.dev/llm-ops-475209/nougat-ocr/nougat-processor:v7 
    env:
      - name: BUCKET_NAME
        value: llm-ops-475209-nougat-ocr
      - name: INPUT_PREFIX
        value: input/
      - name: OUTPUT_PREFIX
        value: output/
  diskSpec:
    bootDiskType: pd-ssd
    bootDiskSizeGb: 100